name: Build RetroFold APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - working-directory: RetroFold
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - run: cp RetroFold/app/build/outputs/apk/debug/app-debug.apk RetroFold-v0.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: RetroFold-v0.1.0-debug, path: RetroFold-v0.1.0-debug.apk, if-no-files-found: error }
