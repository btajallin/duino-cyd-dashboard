name: Build RetroFetch APK
on:
  workflow_dispatch:
  push:
    branches: [ retrofetch-build ]
    paths: [ 'RetroFetch/**', '.github/workflows/retrofetch-build.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - working-directory: RetroFetch
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - run: cp RetroFetch/app/build/outputs/apk/debug/app-debug.apk RetroFetch-v0.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RetroFetch-v0.1.0-debug
          path: RetroFetch-v0.1.0-debug.apk
          if-no-files-found: error
